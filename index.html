<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 Лото — график отпусков 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2a2112; --muted: #6e5c3c; }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink);
    font: 15px/1.4 Montserrat, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 420px at 0% -10%, #fff6bf, transparent 60%),
      linear-gradient(165deg, #fff4c2 0%, #ffe56a 48%, #ffd24a 100%);
    min-height: 100vh;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px 56px; }
  header { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end; }
  .logo { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .brand { height: 24px; width: auto; background: transparent; display: block; margin: 0; }
  .mark {
    width: 74px; height: 74px; border-radius: 22px; position: relative;
    background: radial-gradient(circle at 32% 28%, #fff7c4, #ffe14a 42%, #f5b800 78%);
    box-shadow: inset -8px -10px 16px rgba(170, 100, 0, .28), 0 10px 22px rgba(150, 90, 0, .22);
  }
  .mark span {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-weight: 900; letter-spacing: -.04em; font-size: 26px; color: #1a1408;
  }
  .mark small {
    position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
    font-size: 9px; letter-spacing: .16em; font-weight: 800;
  }
  h1 { margin: 0; font-size: 32px; letter-spacing: -.03em; }
  .sub { margin: 8px 0 12px; color: var(--muted); max-width: 680px; }
  .year { font-size: 56px; font-weight: 800; letter-spacing: -.04em; color: #fff; text-shadow: 0 4px 0 rgba(180, 110, 0, .25); }
  .keys { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .key { background: rgba(255,253,246,.8); border-radius: 999px; padding: 5px 10px; font-size: 13px; }
  .key i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
  .people { display: flex; align-items: center; gap: 16px; }
  .legend { display: grid; grid-template-columns: repeat(3, 230px); gap: 8px; margin-bottom: 0; }
  .chip { border: 0; cursor: pointer; text-align: left; color: inherit; border-radius: 14px; padding: 8px 10px; background: rgba(255,253,246,.88); }
  .chip.off { opacity: .35; }
  .chip b { display: block; }
  .chip span { color: var(--muted); font-size: 12px; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.08); }
  .stage { position: relative; overflow: visible; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; position: relative; z-index: 1; }
  .robot {
    position: absolute; z-index: 0; width: 440px; right: 52px; top: -276px;
    pointer-events: none; transform-origin: 58% 72%;
    animation: wave 3.6s ease-in-out infinite;
  }
  .robot.arm { z-index: 3; clip-path: inset(48% 84% 18% 0%); }
  @keyframes wave {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-8px) rotate(2.5deg); }
  }
  @media (prefers-reduced-motion: reduce) { .robot { animation: none; } }
  .month { background: #fffdf6; border-radius: 18px; padding: 12px; position: relative; z-index: 1; }
  .month h2 { margin: 0 0 8px; font-size: 16px; }
  .dow, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { color: var(--muted); font-size: 11px; text-align: center; margin-bottom: 4px; }
  .day { min-height: 78px; border-radius: 8px; padding: 3px; background: #fff; }
  .day.empty { background: transparent; }
  .day .n { font-size: 12px; font-weight: 700; }
  .day.weekend { background: #ffed6b; }
  .day.holiday { background: #dbf06c; }
  .day.short { background: #fff4d4; }
  .names { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
  .names em {
    font-style: normal; font-size: 10px; line-height: 1.2; border-radius: 4px;
    padding: 1px 3px; font-weight: 650;
  }
  .who { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { background: rgba(255,253,246,.9); border-radius: 14px; padding: 12px 14px; }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  .card ul { margin: 0; padding-left: 18px; }
  .note { color: var(--muted); font-size: 13px; margin-top: 4px; }
  footer { margin-top: 14px; color: var(--muted); font-size: 13px; }
  @media (max-width: 800px) { .grid, .who, .legend { grid-template-columns: 1fr; } .people { flex-direction: column; align-items: flex-start; } .robot { width: 220px; right: 8px; top: -160px; } .names em { font-size: 9px; } }
</style>
</head>

<script>
const PEOPLE = [
  { id: "sveta", name: "Светлана Сальникова", short: "Светлана С.", bg: "#c6c6f4", fg: "#4a4a88",
    ranges: [["2027-03-15","2027-03-21"],["2027-08-02","2027-08-08"],["2027-09-06","2027-09-19"]] },
  { id: "olga", name: "Ольга Солдатова", short: "Ольга С.", bg: "#f7d7eb", fg: "#8a4a6e",
    ranges: [["2027-04-26","2027-05-03"],["2027-06-15","2027-06-28"],["2027-08-30","2027-09-05"]] },
  { id: "mitro", name: "Анна Митрофанова", short: "Анна М.", bg: "#eccbc2", fg: "#7a4e44",
    ranges: [["2027-03-22","2027-04-04"],["2027-05-31","2027-06-13"],["2027-10-19","2027-11-03"]] },
  { id: "merz", name: "Анна Мерзликина", short: "Анна М.", bg: "#e1dfeb", fg: "#5a5670",
    ranges: [["2027-04-19","2027-04-25"],["2027-08-09","2027-08-22"],["2027-11-08","2027-11-14"]] },
  { id: "nastya", name: "Анастасия Камерер", short: "Анастасия К.", bg: "#f6e6b3", fg: "#7a6230",
    ranges: [["2027-02-08","2027-02-14"],["2027-07-19","2027-08-01"],["2027-11-15","2027-11-21"]] },
  { id: "elena", name: "Елена Пьянкова", short: "Елена П.", bg: "#f4f49f", fg: "#6a6a20",
    ranges: [["2027-04-05","2027-04-18"],["2027-07-05","2027-07-18"]] }
];
const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const DOW = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const HOL = new Set(["2027-01-01","2027-01-02","2027-01-03","2027-01-04","2027-01-05","2027-01-06","2027-01-07","2027-01-08","2027-02-22","2027-02-23","2027-03-08","2027-05-01","2027-05-03","2027-05-09","2027-05-10","2027-06-12","2027-06-14","2027-11-04","2027-11-05","2027-12-31"]);
const SHORT = new Set(["2027-02-20","2027-04-30","2027-06-11","2027-11-03"]);
const WORK_SAT = new Set(["2027-02-20"]);
const iso = (d) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse = (s) => { const [y,m,day] = s.split("-").map(Number); return new Date(y, m-1, day); };
const fmt = (s) => { const d = parse(s); return d.getDate()+" "+["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"][d.getMonth()]; };
const daysIn = (a,b) => Math.round((parse(b)-parse(a))/86400000)+1;
const covers = (p,s) => p.ranges.some(([a,b]) => s>=a && s<=b);
function kind(s, d) {
  if (WORK_SAT.has(s)) return "";
  if (HOL.has(s)) return "holiday";
  const w = d.getDay();
  return (w===0 || w===6) ? "weekend" : "";
}
let hidden = new Set();
function render() {
  document.getElementById("legend").innerHTML = PEOPLE.map(p => {
    const n = p.ranges.reduce((s,[a,b]) => s+daysIn(a,b), 0);
    return `<button class="chip${hidden.has(p.id)?" off":""}" data-id="${p.id}"><b><i class="sw" style="background:${p.bg}"></i>${p.name}</b><span>${n} календарных дней</span></button>`;
  }).join("");
  document.getElementById("legend").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    hidden.has(b.dataset.id) ? hidden.delete(b.dataset.id) : hidden.add(b.dataset.id);
    render();
  };
  document.getElementById("grid").innerHTML = MONTHS.map((name, mi) => {
    const lead = (new Date(2027, mi, 1).getDay()+6)%7;
    const count = new Date(2027, mi+1, 0).getDate();
    const cells = Array(lead).fill('<div class="day empty"></div>');
    for (let day=1; day<=count; day++) {
      const d = new Date(2027, mi, day);
      const s = iso(d);
      const people = PEOPLE.filter(p => !hidden.has(p.id) && covers(p, s));
      const tags = people.map(p => `<em style="background:${p.bg};color:${p.fg}">${p.short}</em>`).join("");
      cells.push(`<div class="day ${kind(s,d)}${SHORT.has(s)?" short":""}"><div class="n">${day}</div><div class="names">${tags}</div></div>`);
    }
    return `<section class="month"><h2>${name}</h2><div class="dow">${DOW.map(x=>`<div>${x}</div>`).join("")}</div><div class="days">${cells.join("")}</div></section>`;
  }).join("");
  document.getElementById("who").innerHTML = PEOPLE.map(p => `<article class="card"><h3><i class="sw" style="background:${p.bg}"></i>${p.name}</h3><ul>${p.ranges.map(([a,b])=>`<li>${fmt(a)} — ${fmt(b)} · ${daysIn(a,b)} дн.</li>`).join("")}</ul>${p.note?`<div class="note">${p.note}</div>`:""}</article>`).join("");
}
render();
</script>
